
name : Install CppUnit Test

jobs :
  install_cppunit_job :
    runs-on : ubuntu-latest
    name    : Install CppUnit

    strategy :
      fail-fast : false

      matrix :
        with-cppunit :
          - no
          - ${HOME}/tools/cppunit
          - tools/cppunit

    steps :
      - name : Checkout
        uses : actions/checkout@v7
        with :
          submodules : recursive

      - name : Print Install Dir
        run : |
          echo "workspace = ${{ github.workspace }}"
          echo "target    = ${{ matrix.with-cppunit }}"
          sudo  mkdir -p  /tools
          ls /
          df -h
        shell : bash

      - name : Install CppUnit
        id   : install-cppunit
        uses : takahiro-itou/install-cppunit-action@v1.1.1
        with :
          install-prefix : "${{ matrix.with-cppunit }}"

      - name : Post-Show Workspace
        run : |
          pwd
          echo "${{ github.workspace }}"
          echo "${{ steps.install-cppunit.outputs.real-install-dir }}"
          if [[ "X${{ matrix.with-cppunit }}Y" != 'XnoY' ]] ; then
            ls -lR "${{ steps.install-cppunit.outputs.real-install-dir }}"
          fi
          df -h
        shell : bash

on :
  push :
    branches : [ "master", "develop" ]
  pull_request :
    branches : [ "master", "develop" ]
  workflow_dispatch :
